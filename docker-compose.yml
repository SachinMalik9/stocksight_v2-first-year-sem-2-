version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: es_stocksight
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  api:
    build: .
    container_name: stocksight_api
    command: python -m src.api.server
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch
    environment:
      - ES_HOST=http://elasticsearch:9200

  price_worker:
    build: .
    container_name: stocksight_price_worker
    command: python -m src.workers.price_ingest
    depends_on:
      - elasticsearch
    environment:
      - ES_HOST=http://elasticsearch:9200

  sentiment_worker:
    build: .
    container_name: stocksight_sentiment_worker
    command: python -m src.workers.sentiment_ingest
    depends_on:
      - elasticsearch
    environment:
      - ES_HOST=http://elasticsearch:9200

volumes:
  es_data:
    driver: local